name: Construire l'APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilation
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk ClioLauncher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ClioLauncher-apk
          path: ClioLauncher.apk
      - name: Publier l'APK (lien fixe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk ClioLauncher.apk \
            --title "Clio Launcher - derniere version" \
            --notes "Compile automatiquement depuis le commit ${GITHUB_SHA::7}." \
            --latest
